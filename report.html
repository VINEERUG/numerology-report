        /* ALL THE CSS FROM YOUR ORIGINAL FILE */
        :root {
            --primary-color: #6D28D9; /* Violet-700 */
            --secondary-color: #EC4899; /* Pink-500 */
            --bg-dark: #0F172A; /* Slate-900 */
            --card-bg: #1E293B; /* Slate-800 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark); 
            background: linear-gradient(135deg, #1E293B, #0F172A);
            color: #e2e8f0; /* Default text color (slate-200) */
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .result-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
            position: relative; 
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: var(--card-bg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), 0 0 15px rgba(109, 40, 217, 0.2);
            border-radius: 0.75rem;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 8px var(--primary-color), 0 0 10px var(--secondary-color);
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), 0 0 25px var(--secondary-color);
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .number-display {
            background: -webkit-linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-all;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--card-bg); }
        ::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }
        .ruler-text { font-size: 0.8rem; color: #9ca3af; }
        .loshu-cell {
            border: 2px solid #374151;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .loshu-cell.has-number {
            font-weight: 700;
            color: #E9D5FF;
        }
        /* Simple button for 'Back' */
        .back-button {
            display: inline-block;
            max-width: 320px; /* max-w-xs */
            width: 100%;
            padding: 12px 0; /* py-3 */
            margin-top: 24px; /* mt-6 */
            font-size: 1.125rem; /* text-lg */
            font-weight: 600; /* font-semibold */
            color: white;
            border-radius: 0.75rem; /* rounded-xl */
            background-color: #7c3aed; /* bg-violet-600 */
            transition: all 0.3s ease-in-out;
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.5), 0 4px 6px -2px rgba(124, 58, 237, 0.25); /* shadow-lg shadow-violet-500/50 */

        }
        .back-button:hover {
            background-color: #6d28d9; /* hover:bg-violet-700 */

        }
