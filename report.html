<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerology Portal | Your Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6D28D9; /* Violet-700 */
            --secondary-color: #EC4899; /* Pink-500 */
            --bg-dark: #0F172A; /* Slate-900 */
            --card-bg: #1E293B; /* Slate-800 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark); 
            background: linear-gradient(135deg, #1E293B, #0F172A);
            color: #e2e8f0; /* Default text color (Slate-200) */
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        /* Custom scrollbar for better look on dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen">
    <main class="container mx-auto p-4 md:p-8 min-h-screen">
        
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="flex flex-col justify-center items-center h-[50vh] text-violet-400">
            <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-violet-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-4 text-lg font-semibold">Generating Your Cosmic Blueprint...</p>
        </div>

        <!-- Results Placeholder (Error/No Data) -->
        <div id="results-placeholder" class="hidden text-center mt-20 p-8 bg-slate-800 rounded-2xl shadow-xl">
            <h2 class="text-3xl font-serif text-pink-400 mb-4">Report Not Found</h2>
            <p class="text-lg text-gray-300 mb-6">It looks like the numerology data could not be loaded. Please return to the calculation page.</p>
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-pink-600 hover:bg-pink-700 transition duration-300">
                Go to Calculator
            </a>
        </div>

        <!-- Report Content Container -->
        <div id="results-content" class="hidden">
            <!-- Content will be injected here by JavaScript -->
        </div>
        
        <!-- Back Button -->
        <div id="back-button-container" class="mt-8 text-center hidden">
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-lg text-white bg-violet-600 hover:bg-violet-700 transition duration-300">
                &larr; Start New Calculation
            </a>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingSpinner = document.getElementById('loading-spinner');
            const resultsContent = document.getElementById('results-content');
            const resultsPlaceholder = document.getElementById('results-placeholder');
            const backButtonContainer = document.getElementById('back-button-container');

            // --- Helper Functions for HTML Generation ---

            /** Creates an individual data box for core numbers. */
            const createDataBox = (title, value, ruler = '', description = '') => `
                <div class="bg-slate-700/50 p-4 rounded-xl shadow-xl border border-violet-500/30 transition duration-300 hover:bg-slate-700 hover:shadow-violet-600/30 h-full">
                    <p class="text-sm font-medium text-purple-300 uppercase">${title}</p>
                    <p class="text-5xl font-serif font-bold text-white mt-1">${value}</p>
                    ${ruler ? `<p class="text-sm text-pink-400 font-semibold mt-1">Ruler: ${ruler}</p>` : ''}
                    ${description ? `<p class="text-xs text-gray-400 mt-2">${description}</p>` : ''}
                </div>
            `;

            /** Creates a visually appealing grid representing Lo Shu. */
            const createGrid = (counts, gridName) => {
                // The grid is 3x3, numbered as: 4 9 2 / 3 5 7 / 8 1 6
                const order = [4, 9, 2, 3, 5, 7, 8, 1, 6];
                const gridHtml = order.map(num => {
                    const count = counts[num] || 0;
                    // Display the number of times it appears, or a dash if missing
                    const countText = count > 0 ? Array(count).fill(num).join('') : '—';
                    const bgColor = count > 0 ? 'bg-violet-600/70 hover:bg-violet-700' : 'bg-slate-800/50';
                    const textColor = count > 0 ? 'text-white' : 'text-gray-500';

                    return `
                        <div class="p-2 text-center border border-slate-600 rounded-lg flex flex-col justify-center items-center h-20 w-full ${bgColor} transition duration-150">
                            <span class="text-sm font-light text-purple-300">${num}</span>
                            <span class="font-bold text-xl ${textColor} mt-0.5">${countText}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="mt-8">
                        <h3 class="text-2xl font-serif text-purple-300 mb-4 text-center border-b border-slate-700 pb-2">${gridName} Grid (Vibrational Counts)</h3>
                        <div class="grid grid-cols-3 gap-2 max-w-xs mx-auto p-4 bg-slate-900/50 rounded-xl shadow-inner">
                            ${gridHtml}
                        </div>
                        <p class="text-xs text-gray-400 mt-3 text-center">Base Grid is from Date of Birth; Full Grid includes Name Numbers.</p>
                    </div>
                `;
            };
            
            /** Renders the entire report based on JSON data. */
            const displayResults = (results, inputs) => {
                const fullName = `${inputs.firstName} ${inputs.middleName ? inputs.middleName + ' ' : ''}${inputs.lastName}`.toUpperCase();
                const dob = inputs.dob;
                
                // 1. Header Section
                let html = `
                    <header class="text-center mb-10 p-6 bg-slate-800/70 rounded-3xl shadow-2xl">
                        <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-white leading-tight">
                            Numerology Report for ${fullName}
                        </h1>
                        <p class="text-lg md:text-xl text-purple-300 mt-2">
                            Born on: ${new Date(dob).toLocaleDateString()} &bull; Zodiac: <span class="font-semibold">${results.zodiacSign}</span>
                        </p>
                    </header>
                `;

                // 2. Core Identity Numbers
                html += `
                    <section class="mb-10">
                        <h2 class="text-3xl font-serif text-pink-400 mb-6 border-b border-slate-700 pb-2">Core Identity</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${createDataBox('Driver (Life Path) Number', results.driverNumber, results.driverRuler, 'Core destiny & direction.')}
                            ${createDataBox('Conductor (Destiny) Number', results.conductorNumber, results.conductorRuler, 'Your identity and interaction with the world.')}
                            ${createDataBox('Soul Urge Number', results.soulUrgeNumber, '', 'The hidden desire of your heart.')}
                            ${createDataBox('Personality Number', results.personalityNumber, '', 'The outward persona you project.')}
                        </div>
                    </section>
                `;

                // 3. Current Cycles & Secondary Numbers
                html += `
                    <section class="mb-10">
                        <h2 class="text-3xl font-serif text-pink-400 mb-6 border-b border-slate-700 pb-2">Vibrational Influences</h2>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                            ${createDataBox('Personal Year', results.personalYear, '', 'Current theme for your life.')}
                            ${createDataBox('Universal Year', results.universalYear, '', 'Global energy affecting everyone.')}
                            ${createDataBox('Success Number', results.successNumber, '', 'Energy leading to achievement.')}
                        </div>
                    </section>
                `;

                // 4. Name & Mobile Analysis
                let correctionStatus = 'text-green-400';
                let correctionReason = 'No suggested correction. Your name vibrates harmoniously with your DOB.';
                if (results.nameCorrectionRequired) {
                    correctionStatus = 'text-red-400';
                    correctionReason = `Correction suggested: ${results.correctionReason}`;
                }
                
                html += `
                    <section class="mb-10 p-6 bg-slate-800/70 rounded-2xl shadow-xl">
                        <h2 class="text-3xl font-serif text-pink-400 mb-4">Name and Mobile Vibe</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                            ${createDataBox('Full Name Total', results.fullNameTotal, '', 'Sum of all letters in your full name.')}
                            ${createDataBox('Reduced Name Number', results.fullNameNumber, '', 'The single-digit essence of your name.')}
                            ${createDataBox('Karmic Debt / Master No.', results.karmicDebt || results.masterNumber || 'N/A', '', 'Special numbers indicating life lessons.')}
                        </div>
                        
                        <!-- Name Correction Status -->
                        <div class="p-4 rounded-xl border-l-4 ${correctionStatus === 'text-green-400' ? 'border-green-500 bg-green-900/30' : 'border-red-500 bg-red-900/30'}">
                            <p class="text-xl font-semibold ${correctionStatus}">${results.nameCorrectionRequired ? 'Name Correction Suggested' : 'Name is Harmonious'}</p>
                            <p class="text-sm mt-1 text-gray-300">${correctionReason}</p>
                        </div>

                        <!-- Mobile Analysis -->
                        <div class="mt-6 p-4 bg-slate-700/50 rounded-xl border border-violet-500/30">
                            <h3 class="text-xl font-serif text-purple-300 mb-2">Mobile Number (${results.mobileNumber || 'N/A'}) Analysis</h3>
                            <p class="text-gray-300 text-sm">${results.mobileAnalysis || 'No mobile number provided for analysis.'}</p>
                        </div>
                    </section>
                `;
                
                // 5. Lo Shu Grid and Lucky Vibrations
                html += `
                    <section class="mb-10">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <!-- Lo Shu Grid -->
                            <div>
                                ${createGrid(results.baseGridCounts, 'Base (DOB)')}
                            </div>
                            <!-- Lucky Info -->
                            <div class="p-6 bg-slate-800/70 rounded-2xl shadow-xl mt-8 lg:mt-0 h-fit">
                                <h3 class="text-3xl font-serif text-pink-400 mb-4 border-b border-slate-700 pb-2">Auspicious Vibrations</h3>
                                <div class="space-y-4">
                                    <div class="bg-slate-700/50 p-3 rounded-lg">
                                        <p class="text-sm font-medium text-purple-300">Lucky Numbers</p>
                                        <p class="text-xl font-bold text-white mt-0.5">${results.luckyNumbers || 'N/A'}</p>
                                    </div>
                                    <div class="bg-slate-700/50 p-3 rounded-lg">
                                        <p class="text-sm font-medium text-purple-300">Lucky Colors</p>
                                        <p class="text-xl font-bold text-white mt-0.5">${results.luckyColors || 'N/A'}</p>
                                    </div>
                                    <div class="bg-slate-700/50 p-3 rounded-lg">
                                        <p class="text-sm font-medium text-purple-300">Compatibility Check</p>
                                        <p class="text-base text-gray-300 mt-0.5">${results.compatibilityData || 'N/A'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                `;

                resultsContent.innerHTML = html;
            };

            // --- Main Execution Block ---
            
            try {
                // Add console log to clearly indicate where we are looking for data
                console.log('Attempting to retrieve report data from localStorage with key "numerologyReport"...');
                
                // 1. Get the data from localStorage
                const storedData = localStorage.getItem('numerologyReport');
                
                if (!storedData) {
                    // Console log the failure reason for debugging
                    console.error('FAILED TO LOAD REPORT: Key "numerologyReport" was not found in localStorage. This happens if index.html was not submitted successfully first.');
                    // No data found, show the placeholder
                    throw new Error('No report data found.'); 
                }

                // 2. Parse the data
                const reportData = JSON.parse(storedData);
                
                if (!reportData.inputs || !reportData.results) {
                    // Data is malformed
                    throw new Error('Report data is invalid.');
                }

                // 3. We have data! Call the display function
                // We pass both the backend results and the user inputs
                displayResults(reportData.results, reportData.inputs);

                // 4. Hide spinner, show content
                loadingSpinner.classList.add('hidden');
                resultsContent.classList.remove('hidden');
                backButtonContainer.classList.remove('hidden');

            } catch (error) {
                // An error occurred, show the placeholder
                console.error(error);
                loadingSpinner.classList.add('hidden');
                resultsPlaceholder.classList.remove('hidden');
                backButtonContainer.classList.add('hidden'); // Hide main back button
            }
        });
    </script>
</body>
</html>
