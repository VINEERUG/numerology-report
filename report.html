<head>

    <title>Numerology Portal | Your Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* ALL THE CSS FROM YOUR ORIGINAL FILE */
        :root {
            --primary-color: #6D28D9; /* Violet-700 */
            --secondary-color: #EC4899; /* Pink-500 */
            --bg-dark: #0F172A; /* Slate-900 */
            --card-bg: #1E293B; /* Slate-800 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark); 
            background: linear-gradient(135deg, #1E293B, #0F172A);
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .result-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
            position: relative; 
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: var(--card-bg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), 0 0 15px rgba(109, 40, 217, 0.2);
            border-radius: 0.75rem;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 8px var(--primary-color), 0 0 10px var(--secondary-color);
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), 0 0 25px var(--secondary-color);
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
