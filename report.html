<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerology Portal | Your Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6D28D9; /* Violet-700 */
            --secondary-color: #EC4899; /* Pink-500 */
            --bg-dark: #0F172A; /* Slate-900 */
            --card-bg: #1E293B; /* Slate-800 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark); 
            background: linear-gradient(135deg, #1E293B, #0F172A);
            color: #e2e8f0; /* Default text color (Slate-200) */
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        /* Custom scrollbar for better look on dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen">
    <main class="container mx-auto p-4 md:p-8 min-h-screen">
        
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="flex flex-col justify-center items-center h-[50vh] text-violet-400">
            <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-violet-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-4 text-lg font-semibold">Generating Your Cosmic Blueprint...</p>
        </div>

        <!-- Results Placeholder (Error/No Data) -->
        <div id="results-placeholder" class="hidden text-center mt-20 p-8 bg-slate-800 rounded-2xl shadow-xl">
            <h2 class="text-3xl font-serif text-pink-400 mb-4">Report Not Found</h2>
            <p class="text-lg text-gray-300 mb-6">It looks like the numerology data could not be loaded. Please return to the calculation page.</p>
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-pink-600 hover:bg-pink-700 transition duration-300">
                Go to Calculator
            </a>
        </div>

        <!-- Report Content Container -->
        <div id="results-content" class="hidden">
            <!-- Content will be injected here by JavaScript -->
        </div>
        
        <!-- Back Button -->
        <div id="back-button-container" class="mt-8 text-center hidden">
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-lg text-white bg-violet-600 hover:bg-violet-700 transition duration-300">
                &larr; Start New Calculation
            </a>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingSpinner = document.getElementById('loading-spinner');
            const resultsContent = document.getElementById('results-content');
            const resultsPlaceholder = document.getElementById('results-placeholder');
            const backButtonContainer = document.getElementById('back-button-container');

            // --- Helper Functions for HTML Generation (Simplified) ---

            /** Creates a visually appealing list item for display. */
            const createListItem = (title, value) => `
                <li class="flex justify-between items-center py-3 border-b border-slate-700/50 hover:bg-slate-700/30 px-2 -mx-2 rounded">
                    <span class="text-lg text-purple-300 font-medium">${title}</span>
                    <span class="text-xl font-bold text-white">${value}</span>
                </li>
            `;
            
            /** Renders the entire report based on JSON data. */
            const displayResults = (results, inputs) => {
                const fullName = `${inputs.firstName} ${inputs.middleName ? inputs.middleName + ' ' : ''}${inputs.lastName}`.toUpperCase();
                const dob = inputs.dob;

                let correctionStatus = 'text-green-400';
                let correctionReason = 'No suggested correction. Your name vibrates harmoniously with your DOB.';
                if (results.nameCorrectionRequired) {
                    correctionStatus = 'text-red-400';
                    correctionReason = `Correction suggested: ${results.correctionReason}`;
                }
                
                // 1. Header Section
                let html = `
                    <header class="text-center mb-10 p-6 bg-slate-800/70 rounded-3xl shadow-2xl">
                        <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-white leading-tight">
                            Numerology Report for ${fullName}
                        </h1>
                        <p class="text-lg md:text-xl text-purple-300 mt-2">
                            Born on: ${new Date(dob).toLocaleDateString()} &bull; Zodiac: <span class="font-semibold">${results.zodiacSign}</span>
                        </p>
                    </header>
                `;

                // 2. Main Report Content - Two Columns for Core Numbers and Cycles
                html += `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Left Column: Core Identity -->
                        <section class="p-6 bg-slate-800 rounded-2xl shadow-xl h-fit">
                            <h2 class="text-3xl font-serif text-pink-400 mb-6 border-b border-slate-700 pb-2">Core Identity Numbers</h2>
                            <ul class="divide-y divide-slate-700">
                                ${createListItem('Life Path (Driver)', `${results.driverNumber} (Ruler: ${results.driverRuler})`)}
                                ${createListItem('Destiny (Conductor)', `${results.conductorNumber} (Ruler: ${results.conductorRuler})`)}
                                ${createListItem('Soul Urge Number', results.soulUrgeNumber)}
                                ${createListItem('Personality Number', results.personalityNumber)}
                                ${createListItem('Karmic Debt / Master No.', results.karmicDebt || results.masterNumber || 'N/A')}
                                ${createListItem('Success Number', results.successNumber)}
                            </ul>
                        </section>

                        <!-- Right Column: Cycles and Vibe -->
                        <section class="p-6 bg-slate-800 rounded-2xl shadow-xl h-fit">
                            <h2 class="text-3xl font-serif text-pink-400 mb-6 border-b border-slate-700 pb-2">Cycles and Name Vibe</h2>
                            <ul class="divide-y divide-slate-700">
                                ${createListItem('Personal Year Cycle', results.personalYear)}
                                ${createListItem('Universal Year Cycle', results.universalYear)}
                                ${createListItem('Full Name Number', `${results.fullNameNumber} (Total: ${results.fullNameTotal})`)}
                                ${createListItem('First Name Number', `${results.firstNameNumber} (Total: ${results.firstNameTotal})`)}
                                ${createListItem('Last Name Number', `${results.lastNameNumber} (Total: ${results.lastNameTotal})`)}
                                ${createListItem('Kua Number (Feng Shui)', results.kuaNumber)}
                            </ul>
                        </section>
                    </div>
                `;
                
                // 3. Additional Analysis Section
                html += `
                    <section class="mt-8 p-6 bg-slate-800 rounded-2xl shadow-xl">
                        <h2 class="text-3xl font-serif text-pink-400 mb-6 border-b border-slate-700 pb-2">Supporting Analysis & Luck</h2>
                        
                        <!-- Lucky Info Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                            <div class="bg-slate-700/50 p-4 rounded-xl border border-violet-500/30">
                                <p class="text-sm font-medium text-purple-300">Lucky Numbers</p>
                                <p class="text-xl font-bold text-white mt-1">${results.luckyNumbers || 'N/A'}</p>
                            </div>
                            <div class="bg-slate-700/50 p-4 rounded-xl border border-violet-500/30">
                                <p class="text-sm font-medium text-purple-300">Lucky Colors</p>
                                <p class="text-xl font-bold text-white mt-1">${results.luckyColors || 'N/A'}</p>
                            </div>
                            <div class="bg-slate-700/50 p-4 rounded-xl border border-violet-500/30">
                                <p class="text-sm font-medium text-purple-300">Driver/Conductor Compatibility</p>
                                <p class="text-base text-gray-300 mt-1">${results.compatibilityData || 'N/A'}</p>
                            </div>
                        </div>

                        <!-- Name Correction Status -->
                        <div class="p-4 rounded-xl border-l-4 ${correctionStatus === 'text-green-400' ? 'border-green-500 bg-green-900/30' : 'border-red-500 bg-red-900/30'} mb-6">
                            <p class="text-xl font-semibold ${correctionStatus} mb-1">${results.nameCorrectionRequired ? 'Name Correction Suggested' : 'Name is Harmonious'}</p>
                            <p class="text-sm text-gray-300">${correctionReason}</p>
                        </div>

                        <!-- Mobile Analysis -->
                        <div class="p-4 bg-slate-700/50 rounded-xl border border-violet-500/30">
                            <h3 class="text-xl font-serif text-purple-300 mb-2">Mobile Number (${results.mobileNumber || 'N/A'}) Analysis</h3>
                            <p class="text-gray-300 text-sm">${results.mobileAnalysis || 'No mobile number provided for analysis.'}</p>
                        </div>
                    </section>
                `;

                resultsContent.innerHTML = html;
            };

            // --- Main Execution Block with Error Handling ---
            
            try {
                // 1. Get the data from localStorage
                const storedData = localStorage.getItem('numerologyReport');
                
                if (!storedData) {
                    console.error('FAILED TO LOAD REPORT: Key "numerologyReport" was not found in localStorage. Please ensure you submit the form on index.html successfully first.');
                    throw new Error('No report data found.'); 
                }

                // 2. Parse the data
                const reportData = JSON.parse(storedData);
                
                if (!reportData.inputs || !reportData.results) {
                    throw new Error('Report data is invalid.');
                }

                // 3. We have data! Call the display function
                displayResults(reportData.results, reportData.inputs);

                // 4. Hide spinner, show content
                loadingSpinner.classList.add('hidden');
                resultsContent.classList.remove('hidden');
                backButtonContainer.classList.remove('hidden');

            } catch (error) {
                // An error occurred, show the placeholder
                console.error(error);
                loadingSpinner.classList.add('hidden');
                resultsPlaceholder.classList.remove('hidden');
                backButtonContainer.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
