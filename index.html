<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Numerology Report Portal</title>
<link rel="stylesheet" href="style.css" />
<style>
/* You can move this to style.css if you want */
body{
  background:#020b20;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}
form{
  background:rgba(0,0,40,0.6);
  padding:2rem;
  border-radius:15px;
  box-shadow:0 0 20px #8800ff;
  width:300px;
}
input,select{
  width:100%;
  padding:8px;
  margin:8px 0;
  border:none;
  border-radius:5px;
  box-sizing: border-box; /* Added for better layout */
}
button{
  width:100%;
  padding:10px;
  background:linear-gradient(90deg,#7f00ff,#e100ff);
  border:none;
  border-radius:8px;
  color:#fff;
  font-size:1rem;
  cursor:pointer;
  transition:0.3s;
  margin-top: 10px; /* Added margin */
}
button:hover{
  box-shadow:0 0 15px #c000ff;
}
button:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.7;
}
</style>
</head>
<body>
<h2>Numerology Report Portal</h2>
<form id="numerologyForm">
  <input type="text" id="firstName" placeholder="First Name" required />
  <input type="text" id="middleName" placeholder="Middle Name" />
  <input type="text" id="lastName" placeholder="Last Name" required />
  <input type="date" id="dob" required />
  <select id="gender" required>
    <option value="">Select Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <input type="text" id="mobile" placeholder="Mobile (optional)" />
  <button type="submit">Reveal My Numbers</button>
</form>
<script src="script.js"></script>
</body>
</html>
