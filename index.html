<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numerology Portal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #d9e4f5, #f6f0ff);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #4a3aff;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      text-align: left;
    }
    input, select, button {
      padding: 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: #4a3aff;
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }
    button:hover {
      background: #3a2adb;
    }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.8rem;
      background: #f7f7ff;
      text-align: left;
    }
    .error {
      color: red;
      margin-top: 1rem;
    }
    .loading {
      margin-top: 1rem;
      color: #4a3aff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🔢 Numerology Portal</h1>
    <form id="numForm">
      <label>First Name</label>
      <input type="text" id="firstName" required>

      <label>Middle Name</label>
      <input type="text" id="middleName">

      <label>Last Name</label>
      <input type="text" id="lastName" required>

      <label>Date of Birth</label>
      <input type="date" id="dob" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Mobile Number</label>
      <input type="text" id="mobile">

      <button type="submit">Generate Report</button>
    </form>

    <div class="loading" id="loading" style="display:none;">Calculating... 🔮</div>
    <div class="error" id="error"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    const form = document.getElementById('numForm');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');
    const loadingDiv = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultDiv.innerHTML = '';
      errorDiv.innerHTML = '';
      loadingDiv.style.display = 'block';

      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        middleName: document.getElementById('middleName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        mobile: document.getElementById('mobile').value.trim()
      };

      try {
        const res = await fetch('https://keshavaggarwal.pythonanywhere.com/api/calc', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': 'yourSuperSecretKey123
'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        loadingDiv.style.display = 'none';

        if (!data.ok) {
          errorDiv.textContent = data.error || 'Calculation failed.';
          return;
        }

        const r = data.report;
        resultDiv.innerHTML = `
          <h3>Numerology Report for ${r.name}</h3>
          <p><strong>Life Path:</strong> ${r.numbers.lifePath}</p>
          <p><strong>Expression:</strong> ${r.numbers.expression}</p>
          <p><strong>Soul Urge:</strong> ${r.numbers.soulUrge}</p>
          <p><strong>Personality:</strong> ${r.numbers.personality}</p>
          <p><strong>Lucky Color:</strong> ${r.colors.luckyColor}</p>
          <p><strong>Aura Color:</strong> ${r.colors.auraColor}</p>
          <hr>
          <p>${r.summary}</p>
        `;
      } catch (err) {
        console.error(err);
        loadingDiv.style.display = 'none';
        errorDiv.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>

</body>
</html>
