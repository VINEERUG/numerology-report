<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0F172A; }
  </style>
</head>
<body class="text-gray-200">
  <div class="min-h-screen flex items-center justify-center">
    <div class="bg-slate-800/60 p-8 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-white text-center mb-6">Admin Login</h1>
      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-purple-300 mb-2">Email</label>
          <input type="email" id="email" name="email" class="form-input-field w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-gray-500" required>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-purple-300 mb-2">Password</label>
          <input type="password" id="password" name="password" class="form-input-field w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-gray-500" required>
        </div>
        <button type="submit" id="login-button" class="w-full py-3 text-lg font-semibold rounded-xl text-white bg-violet-600 hover:bg-violet-700 transition">Login</button>
        <div id="login-error" class="text-pink-400 text-sm mt-4 hidden p-3 bg-slate-700/50 rounded-lg"></div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
