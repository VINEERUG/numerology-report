<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Reports - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #111827; /* Dark gray background */
            color: #D1D5DB; /* Light gray text */
        }
        .table-container {
            background-color: #1F2937; /* Darker card background */
            border: 1px solid #374151;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }
        th, td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #374151;
            white-space: nowrap;
        }
        thead {
            background-color: #374151; /* Dark header background */
        }
        th {
            color: #F3F4F6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            text-align: left;
        }
        tbody tr {
            background-color: #1F2937; /* Row background */
        }
        tbody tr:hover {
            background-color: #374151; /* Row hover background */
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-danger { background-color: #dc2626; color: white; }
        .btn-danger:hover { background-color: #b91c1c; }
        .btn-link { color: #60a5fa; font-weight: 500; }
        .btn-link:hover { color: #3b82f6; }
        .pagination-btn {
            background-color: #374151;
            color: #D1D5DB;
        }
        .pagination-btn:disabled {
            background-color: #1F2937;
            color: #6B7280;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-white">View All Reports</h1>
            <div>
                <a href="users.html" class="btn btn-primary mr-4">Manage Users</a>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </header>

        <main id="reports-container" class="table-container">
            <!-- JS will populate this -->
            <div class="p-8 text-center"><p>Loading reports...</p></div>
        </main>
        
        <!-- Pagination Controls -->
        <footer id="pagination-controls" class="flex justify-between items-center mt-6">
            <!-- JS will populate this -->
        </footer>
    </div>
    <script src="auth.js"></script>
    <script src="admin.js"></script>
</body>
</html>
