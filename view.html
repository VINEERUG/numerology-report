<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Reports - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #111827; /* Dark background */
            color: #D1D5DB; /* Light text */
        }
        .table-container {
            background-color: #1F2937; /* Darker card background */
            border: 1px solid #374151;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }
        th, td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #374151;
        }
        thead {
            background-color: #374151; /* Header background */
        }
        th {
            color: #F3F4F6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
        }
        tbody tr:hover {
            background-color: #374151;
        }
        .btn-primary {
            background-color: #4f46e5;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #4338ca;
        }
        .btn-danger {
            background-color: #dc2626;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        .btn-link {
            color: #60a5fa;
            font-weight: 500;
            transition: color 0.2s;
        }
        .btn-link:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header Section -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-white">View Reports</h1>
            <div>
                <a href="users.html" class="btn-primary mr-4">Manage Users</a>
                <button id="logout-btn" class="btn-danger">Logout</button>
            </div>
        </header>

        <!-- Reports Table Container -->
        <main id="reports-container" class="table-container">
            <!-- JavaScript will populate this section -->
            <div class="p-8 text-center">
                <p>Loading reports...</p>
            </div>
        </main>
    </div>

    <!-- The admin.js script controls this page's logic -->
    <script src="admin.js"></script>
</body>
</html>
