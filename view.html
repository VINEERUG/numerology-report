<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* You can keep your custom styles here if you have any */
        .report-card {
            background-color: #1a202c; /* A dark gray, adjust as needed */
            border: 1px solid #4a5568; /* A lighter gray border */
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="text-gray-200">
    <div class="container mx-auto p-4 md:p-8">

        <!-- ============== MODIFIED HEADER ============== -->
        <header class="flex justify-between items-center mb-10">
            <h1 class="font-serif text-4xl md:text-6xl font-bold text-white">Saved Reports</h1>
            
            <!-- This div groups your buttons together -->
            <div class="flex items-center space-x-4">
                <!-- This is the new link to the user management page -->
                <a href="users.html" class="py-2 px-4 font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition">
                    Manage Users
                </a>
                
                <!-- Your existing logout button -->
                <button id="logout-button" class="py-2 px-4 font-semibold rounded-xl text-white bg-pink-600 hover:bg-pink-700 transition">
                    Logout
                </button>
            </div>
        </header>
        <!-- ============================================= -->

        <main id="reports-container" class="max-w-4xl mx-auto">
            <p id="loading-message" class="text-lg text-purple-300">Loading reports...</p>
            <!-- Reports will be loaded here by admin.js -->
        </main>
    </div>

    <!-- IMPORTANT: The 'admin.js' script handles the logic for this page -->
    <script src="admin.js"></script>
</body>
</html>
