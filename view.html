<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --card-bg: #1E293B; }
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .report-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="text-gray-200">
    <div class="container mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-10">
            <h1 class="font-serif text-4xl md:text-6xl font-bold text-white">Saved Reports</h1>
            <button id="logout-button" class="py-2 px-4 font-semibold rounded-xl text-white bg-pink-600 hover:bg-pink-700 transition">
                Logout
            </button>
        </header>

        <main id="reports-container" class="max-w-4xl mx-auto">
            <p id="loading-message" class="text-lg text-purple-300">Loading reports...</p>
            </main>
    </div>
    <script src="admin.js"></script>
</body>
</html>
